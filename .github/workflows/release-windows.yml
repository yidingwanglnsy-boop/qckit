name: Build Windows Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:   # 手动触发用于测试

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Install backend + build deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: PyInstaller
        run: python build_windows.py

      - name: Compute checksum
        run: |
          $h = Get-FileHash dist\QCKit.exe -Algorithm SHA256
          "$($h.Hash)  QCKit.exe" | Out-File -Encoding ascii dist\QCKit.exe.sha256
          Get-Content dist\QCKit.exe.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QCKit-windows-x64
          path: |
            dist/QCKit.exe
            dist/QCKit.exe.sha256

      - name: Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/QCKit.exe
            dist/QCKit.exe.sha256
          generate_release_notes: true
