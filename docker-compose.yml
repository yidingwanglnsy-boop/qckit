# QCKit —— 一键本地部署
#
# 用法（Linux/Mac/Windows Docker Desktop 通用）：
#   docker compose up -d          # 后台启动
#   docker compose down           # 停止
#   docker compose logs -f qckit  # 看日志
#
# 首次启动后浏览器打开 http://localhost:8000
# 数据（配置/项目/历史）保存在同目录的 ./data/ 中，删除容器不会丢

services:
  qckit:
    build: .
    image: qckit:latest
    container_name: qckit
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - QCKIT_LLM_BASE_URL=${QCKIT_LLM_BASE_URL:-https://api.openai.com/v1}
      - QCKIT_LLM_API_KEY=${QCKIT_LLM_API_KEY:-}
      - QCKIT_LLM_MODEL=${QCKIT_LLM_MODEL:-gpt-4o-mini}
    volumes:
      - ./data:/root/.qckit
